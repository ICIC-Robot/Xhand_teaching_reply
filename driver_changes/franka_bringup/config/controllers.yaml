cartesian_keyboard_controller:
  ros__parameters:
    arm_id: panda
    # Max linear velocity = linear_speed_scale m/s (applied to unit key input)
    linear_speed_scale: 0.1
    # Max angular velocity = angular_speed_scale rad/s
    angular_speed_scale: 0.3
    # Zero commands automatically if no message received within this many ms
    watchdog_timeout_ms: 500.0

teach_record_controller:
  ros__parameters:
    arm_id: panda
    # tau = -damping * dq (Nm per rad/s), clamped to +/- tau_max (Nm)
    damping: [5.0, 5.0, 5.0, 5.0, 2.0, 2.0, 1.0]
    tau_max: [20.0, 20.0, 20.0, 20.0, 6.0, 6.0, 6.0]
    publish_rate: 500.0  # Hz, ~/joint_states for ros2 bag

trajectory_replay_controller:
  ros__parameters:
    arm_id: panda
    trajectory_file: ""  # set by teach_replay replay_demo before configuring
    k_gains: [600.0, 600.0, 600.0, 600.0, 250.0, 150.0, 50.0]
    d_gains: [50.0, 50.0, 50.0, 50.0, 30.0, 25.0, 15.0]
    tau_max: [60.0, 60.0, 60.0, 60.0, 10.0, 10.0, 10.0]
    approach_max_velocity: 0.2   # rad/s, move-to-start speed cap
    min_approach_duration: 3.0   # s
    max_tracking_error: 0.15     # rad; beyond this the timeline waits for the arm
    progress_rate: 100.0         # Hz, ~/progress for the hand replay
