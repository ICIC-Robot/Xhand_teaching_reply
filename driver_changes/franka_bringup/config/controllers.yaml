controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    gravity_compensation_example_controller:
      type: franka_example_controllers/GravityCompensationExampleController

    joint_impedance_example_controller:
      type: franka_example_controllers/JointImpedanceExampleController

    joint_position_example_controller:
      type: franka_example_controllers/JointPositionExampleController

    joint_velocity_example_controller:
      type: franka_example_controllers/JointVelocityExampleController
    
    cartesian_velocity_example_controller:
      type: franka_example_controllers/CartesianVelocityExampleController

    cartesian_keyboard_controller:
      type: franka_example_controllers/CartesianKeyboardController

    move_to_start_example_controller:
      type: franka_example_controllers/MoveToStartExampleController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

    # teach_replay: hand-guided recording and deterministic replay (src/integration/teach_replay*)
    teach_record_controller:
      type: teach_replay_controllers/TeachRecordController

    trajectory_replay_controller:
      type: teach_replay_controllers/TrajectoryReplayController

franka_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda
    
# Added for waypoint_teleop's replay_waypoints.py (single-arm path, use
# --controller-name joint_trajectory_controller) -- mirrors
# dual_controllers.yaml's dual_joint_trajectory_controller entry, but for
# this single arm's real joint names (panda_jointN). The plugin class this
# entry used to reference, "joint_effort_trajectory_controller/
# JointTrajectoryController", does not exist as an installed package
# anywhere on this machine (see waypoint_teleop/README.md), so it could
# never have worked; replaced with the real, installed
# joint_trajectory_controller/JointTrajectoryController plugin using a
# position command interface, identical in kind to the one already
# validated for dual_joint_trajectory_controller.
joint_trajectory_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    interpolation_method: splines
    allow_partial_joints_goal: false
    open_loop_control: false

